# This is a basic workflow to help you get started with Actions

name: Proxy Updator

# Controls when the workflow will run
on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: write

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Install Python3
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      # Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Generate the proxy list
      - run: curl -s "${{secrets.UPDATER}}" -o "proxy_list.txt"
      
      # Publish the proxy list as a single-commit orphan branch (no history growth)
      - name: Publish to data branch
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "${{ secrets.GIT_EMAIL }}"
          git config --local user.name "${{ secrets.GIT_NAME }}"
          git checkout --orphan data-tmp
          git rm -rf --cached . > /dev/null
          git add -f proxy_list.txt
          git commit -m "Updated Proxies"
          git push --force origin HEAD:data
